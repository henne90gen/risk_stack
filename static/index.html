<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Risk Stack</title>
        <!-- Adds the COOP/COEP headers that SharedArrayBuffer needs when the host
             doesn't send them; reloads the page once on the first visit. Must
             come first. -->
        <script src="coi-serviceworker.js"></script>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            html,
            body {
                width: 100%;
                height: 100%;
                background: #000;
                overflow: hidden;
            }
            canvas {
                display: block;
                width: 100%;
                height: 100%;
                /* Pixel-perfect rendering — no browser smoothing */
                image-rendering: pixelated;
            }
        </style>
    </head>
    <body>
        <canvas id="canvas"></canvas>

        <script src="webgl.js"></script>
        <script>
            let wasmMemory = null; // set once the instance is created
            (async () => {
                // -------------------------------------------------------------------------
                // Memory helpers (Wasm <-> JS string / buffer access)
                // -------------------------------------------------------------------------

                // Web APIs (TextDecoder, crypto, WebGL) reject views on shared
                // memory, so anything handed to them is copied out with slice().
                function getString(ptr, len) {
                    const array = new Uint8Array(wasmMemory.buffer, ptr, len);
                    const decoder = new TextDecoder();
                    return decoder.decode(array.slice());
                }

                if (!crossOriginIsolated) {
                    // The service worker reloads the page once it is active, so
                    // this only sticks if that can't happen (no HTTPS, private mode).
                    document.body.textContent =
                        "This page needs SharedArrayBuffer: serve it over HTTPS (or localhost) " +
                        "with service workers enabled, or send the headers " +
                        "Cross-Origin-Opener-Policy: same-origin and " +
                        "Cross-Origin-Embedder-Policy: require-corp.";
                    return;
                }

                // Workers share this memory with the main thread. The sizes must
                // match initial_memory/max_memory in build.zig (in 64 KiB pages).
                wasmMemory = new WebAssembly.Memory({
                    initial: 1024,
                    maximum: 16384,
                    shared: true,
                });
                let wasmModule = null; // set once compiled, before any worker starts

                const canvas = document.getElementById("canvas");
                const webgl = initWebGL(canvas, getString);

                const env = {
                    memory: wasmMemory,

                    // Backing for the worker pool (see src/wasm_threads.zig).
                    hardwareConcurrency() {
                        return navigator.hardwareConcurrency || 2;
                    },
                    spawnWorker(stackTop) {
                        const worker = new Worker("worker.js");
                        worker.onerror = (e) => console.error("worker failed:", e.message);
                        worker.postMessage({
                            module: wasmModule,
                            memory: wasmMemory,
                            stackTop,
                        });
                    },

                    logInfo(ptr, len) {
                        console.log(getString(ptr, len));
                    },
                    logWarn(ptr, len) {
                        console.warn(getString(ptr, len));
                    },
                    logErr(ptr, len) {
                        console.error(getString(ptr, len));
                    },

                    // Backing for platform.writeStorage/readStorage.
                    storageWrite(namePtr, nameLen, dataPtr, dataLen) {
                        localStorage.setItem(
                            getString(namePtr, nameLen),
                            getString(dataPtr, dataLen),
                        );
                    },
                    storageLength(namePtr, nameLen) {
                        const value = localStorage.getItem(
                            getString(namePtr, nameLen),
                        );
                        return value === null
                            ? -1
                            : new TextEncoder().encode(value).length;
                    },
                    storageRead(namePtr, nameLen, bufPtr, bufLen) {
                        const value =
                            localStorage.getItem(getString(namePtr, nameLen)) ??
                            "";
                        new TextEncoder().encodeInto(
                            value,
                            new Uint8Array(wasmMemory.buffer, bufPtr, bufLen),
                        );
                    },

                    // Backing for the Zig-side std.Io (see main_wasm.zig).
                    dateNow() {
                        return Date.now();
                    },
                    performanceNow() {
                        return performance.now();
                    },
                    getRandomValues(ptr, len) {
                        const bytes = new Uint8Array(len);
                        crypto.getRandomValues(bytes);
                        new Uint8Array(wasmMemory.buffer, ptr, len).set(bytes);
                    },

                    ...webgl,
                };

                // -------------------------------------------------------------------------
                // Load and instantiate the Wasm module
                // -------------------------------------------------------------------------

                console.log("Loading risk_stack.wasm...");
                const response = await fetch("risk_stack.wasm", {
                    cache: "no-store",
                });
                const { instance, module } =
                    await WebAssembly.instantiateStreaming(response, { env });
                wasmModule = module;

                const {
                    onInit,
                    onResize,
                    onKeyDown,
                    onKeyUp,
                    onMouseDown,
                    onMouseUp,
                    onMouseMove,
                    onMouseWheel,
                    onAnimationFrame,
                } = instance.exports;

                window.addEventListener("keydown", (e) => {
                    onKeyDown(e.keyCode);
                });
                window.addEventListener("keyup", (e) => {
                    onKeyUp(e.keyCode);
                });
                canvas.addEventListener("mousedown", (e) => {
                    onMouseDown(e.button, e.clientX, e.clientY);
                });
                canvas.addEventListener("mouseup", (e) => {
                    onMouseUp(e.button, e.clientX, e.clientY);
                });
                canvas.addEventListener("mousemove", (e) => {
                    onMouseMove(e.clientX, e.clientY);
                });
                // Normalise to wheel notches (SDL's wheel.y): browsers report
                // roughly 100 pixels or 3 lines per notch, depending on deltaMode.
                canvas.addEventListener(
                    "wheel",
                    (e) => {
                        e.preventDefault();
                        const notches =
                            e.deltaMode === WheelEvent.DOM_DELTA_PIXEL
                                ? e.deltaY / 100
                                : e.deltaMode === WheelEvent.DOM_DELTA_LINE
                                  ? e.deltaY / 3
                                  : e.deltaY;
                        onMouseWheel(-notches);
                    },
                    { passive: false },
                );

                // -------------------------------------------------------------------------
                // Init and run loop
                // -------------------------------------------------------------------------

                onInit();

                function resize() {
                    const dpr = window.devicePixelRatio || 1;
                    const w = canvas.clientWidth;
                    const h = canvas.clientHeight;
                    const pw = Math.round(w * dpr);
                    const ph = Math.round(h * dpr);
                    canvas.width = pw;
                    canvas.height = ph;
                    onResize(w, h, dpr);
                }
                new ResizeObserver(resize).observe(canvas);

                function frame() {
                    onAnimationFrame();
                    requestAnimationFrame(frame);
                }
                requestAnimationFrame(frame);
            })();
        </script>
    </body>
</html>
